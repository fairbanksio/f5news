service: scraper
frameworkVersion: "4"

provider:
  name: aws
  region: us-east-1
  architecture: arm64
  ecr:
    images:
      scraper:
        path: ../..
        file: services/scraper/Dockerfile
        platform: linux/arm64
        provenance: false
  environment:
    MONGO_CONNECTION_STRING: ${env:MONGO_CONNECTION_STRING, ssm:/primary_db_connection_string}
    REDDIT_USERNAME: ${env:REDDIT_USERNAME, ssm:/reddit_username}
    REDDIT_PASSWORD: ${env:REDDIT_PASSWORD, ssm:/reddit_password}
    F5_REDDIT_SESSION_BUCKET: ${env:F5_REDDIT_SESSION_BUCKET, ssm:/f5_reddit_session_bucket}
    F5_REDDIT_SESSION_ENABLED: "true"
  iam:
    role:
      statements:
        - Sid: SharedRedditSessionObjects
          Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource:
            Fn::Join:
              - ""
              - - "arn:"
                - Ref: AWS::Partition
                - ":s3:::"
                - ${self:provider.environment.F5_REDDIT_SESSION_BUCKET}
                - "/reddit/sessions/*.json"

functions:
  fetchPosts:
    name: ${self:service}-${sls:stage}-fetchPosts-browser
    timeout: 240
    memorySize: 3008
    ephemeralStorageSize: 1024
    image: scraper
    logRetentionInDays: 7
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: false
          input:
            allFeeds: true
            session: true
            scheduled: true
      - schedule:
          rate: rate(12 hours)
          enabled: false
          input:
            subreddit: politics
            session: true
            renewSession: true
            scheduled: true

resources:
  extensions:
    FetchPostsLogGroup:
      UpdateReplacePolicy: Retain
