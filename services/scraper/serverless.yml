service: scraper
frameworkVersion: "4"

provider:
  name: aws
  region: us-east-1
  architecture: arm64
  ecr:
    images:
      scraper:
        path: ../..
        file: services/scraper/Dockerfile
        platform: linux/arm64
        provenance: false
  environment:
    MONGO_CONNECTION_STRING: ${env:MONGO_CONNECTION_STRING, ssm:/primary_db_connection_string}
    REDDIT_USERNAME: ${env:REDDIT_USERNAME, ssm:/reddit_username}
    REDDIT_PASSWORD: ${env:REDDIT_PASSWORD, ssm:/reddit_password}

functions:
  fetchPosts:
    name: ${self:service}-${sls:stage}-fetchPosts-browser
    timeout: 240
    memorySize: 2048
    ephemeralStorageSize: 1024
    image: scraper
    logRetentionInDays: 7
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: politics
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: worldnews
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: europe
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: news
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: technology
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: science
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: health
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: energy
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: sports
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: business
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            subreddit: Economics

resources:
  extensions:
    FetchPostsLogGroup:
      UpdateReplacePolicy: Retain
