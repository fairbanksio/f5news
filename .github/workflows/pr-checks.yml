name: PR Checks

on:
  pull_request:
    branches:
      - develop
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-source:
    name: Release source
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require develop as the release source
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: test "$HEAD_REF" = "develop"

  infrastructure:
    name: Infrastructure
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.4"

      - name: Terraform Init
        working-directory: infrastructure
        run: terraform init -backend=false

      - name: Terraform Format
        working-directory: infrastructure
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform Configuration Tests
        working-directory: infrastructure
        run: terraform test

  services:
    name: Services
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/posts
          - services/scraper
          - services/subreddits

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Security policy tests
        if: matrix.service == 'services/scraper'
        run: node --test .github/security.test.cjs scripts/check-browser-deployment.test.cjs

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint

      - name: Test
        working-directory: ${{ matrix.service }}
        run: npm test

  scraper-container:
    name: Scraper Container
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Build Scraper Image
        run: docker build --platform linux/arm64 --provenance=false -f services/scraper/Dockerfile -t f5-scraper:test .

      - name: Test Browser Extraction
        run: python3 -m unittest discover -s scripts/reddit-invisible -p 'test_*.py'

      - name: Check Packaged Handler and Mappers
        run: |
          docker image inspect f5-scraper:test --format '{{json .Config.Cmd}}' | \
            python3 -c 'import json, sys; assert json.load(sys.stdin) == ["index.fetchPosts"]'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=512m \
            --entrypoint node f5-scraper:test -e '
          const assert = require("node:assert/strict");
          assert.equal(typeof require("./index").fetchPosts, "function");
          Promise.all([import("/app/scripts/reddit-stagehand/f5-record.js"), import("/app/scripts/reddit-stagehand/f5-dom.js")]).then(([record, dom]) => {
            assert.equal(typeof record.toF5Record, "function");
            assert.equal(typeof dom.readListing, "function");
          }).catch(error => { console.error(error); process.exitCode = 1; });
          '

      - name: Check Read-Only Browser Startup
        run: |
          docker run --rm --network none --read-only --pids-limit 1024 --memory 3008m \
            --tmpfs /tmp:rw,size=1g f5-scraper:test python -c '
          import os, subprocess, sys
          assert os.getuid() != 0
          check = """from invisible_playwright import InvisiblePlaywright
          with InvisiblePlaywright(headless=True, timezone="UTC", locale="en-US") as browser:
              page = browser.new_page()
              page.goto("data:text/html,<title>Scraper Startup</title>")
              assert page.title() == "Scraper Startup"
          """
          for _ in range(3):
              subprocess.run([sys.executable, "-c", check], check=True)
          '

      - name: Check Offline Browser Session Roundtrip
        run: |
          docker run --rm --network none --read-only --pids-limit 1024 --memory 3008m \
            --tmpfs /tmp:rw,size=1g f5-scraper:test \
            python /app/scripts/reddit-invisible/check_session_runtime.py

      - name: Check Lambda Entrypoint Compatibility
        run: |
          cat > /tmp/f5-lambda-seccomp.json <<'EOF'
          {"defaultAction":"SCMP_ACT_ALLOW","syscalls":[{"names":["prctl"],"action":"SCMP_ACT_ERRNO","errnoRet":1,"args":[{"index":0,"value":36,"op":"SCMP_CMP_EQ"}]}]}
          EOF
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt seccomp=/tmp/f5-lambda-seccomp.json \
            --tmpfs /tmp:rw,size=64m --env AWS_LAMBDA_RUNTIME_API=test \
            f5-scraper:test node -e 'require("node:assert/strict").equal(process.pid, 1)'

  webui:
    name: Web UI
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        working-directory: webui
        run: npm ci

      - name: Lint
        working-directory: webui
        run: npm run lint

      - name: Test
        working-directory: webui
        run: CI=true npm test -- --watchAll=false

      - name: Build
        working-directory: webui
        run: npm run build
