name: Weekly Develop to Main

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: weekly-develop-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Open and merge develop release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Detect unreleased develop changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead_by="$(gh api "repos/${{ github.repository }}/compare/main...develop" --jq '.ahead_by')"
          echo "has_changes=$([ "$ahead_by" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create or find release PR
        if: steps.changes.outputs.has_changes == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr_url="$(gh pr list --base main --head develop --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head develop \
              --title "chore: release develop to main" \
              --body "Automated weekly release PR from develop to main. It merges only after the required checks pass.")"
          fi

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable automatic merge when the release is clean
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.release.outputs.pr_url }}
        run: |
          gh pr merge "$PR_URL" --auto --merge
