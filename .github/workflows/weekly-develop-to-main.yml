name: Weekly Develop to Main

on:
  schedule:
    # Avoid the start-of-hour Actions scheduling hot spot.
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: weekly-develop-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Open and merge develop release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Detect unreleased develop changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead_by="$(gh api "repos/${{ github.repository }}/compare/main...develop" --jq '.ahead_by')"
          echo "has_changes=$([ "$ahead_by" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create or find release PR
        if: steps.changes.outputs.has_changes == 'true'
        id: release
        env:
          # A repository token is needed here so opening the release PR emits
          # the normal pull_request_target check events. GITHUB_TOKEN-created
          # PRs intentionally do not trigger other workflows.
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr_url="$(gh pr list --base main --head develop --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head develop \
              --title "chore: release develop to main" \
              --body "Automated weekly release PR from develop to main. It merges only after the required checks pass.")"
          fi

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks and merge the release
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.release.outputs.pr_url }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
        run: |
          # The trusted develop-to-main PR runs its required workflows through
          # pull_request_target. Check the exact release commit so this job
          # observes the same contexts enforced by main branch protection.
          required_checks='["Infrastructure","Web UI","Services (services/posts)","Services (services/scraper)","Services (services/subreddits)","Snyk (services/posts)","Snyk (services/scraper)","Snyk (services/subreddits)","Snyk (webui)","Release source"]'
          release_head_sha="$HEAD_SHA"
          missing_checks=""

          for attempt in {1..30}; do
            current_head_sha="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
            if [ "$current_head_sha" != "$release_head_sha" ]; then
              release_head_sha="$current_head_sha"
            fi

            check_runs="$(gh api "repos/$GH_REPO/commits/$release_head_sha/check-runs?per_page=100")"
            missing_checks="$(jq -r --argjson required "$required_checks" '
              [
                $required[] as $required_check
                | select(
                    any(
                      .check_runs[];
                      (.app.slug == "github-actions")
                      and (.name == $required_check)
                      and (.status == "completed")
                      and (.conclusion == "success")
                    ) | not
                  )
                | $required_check
              ]
              | .[]?
            ' <<< "$check_runs")"
            if [ -z "$missing_checks" ]; then
              break
            fi

            echo "Waiting for required checks on $release_head_sha: $missing_checks"
            sleep 10
          done

          if [ -n "$missing_checks" ]; then
            echo "Timed out waiting for required checks on $release_head_sha: $missing_checks" >&2
            exit 1
          fi

          # Enable GitHub's normal policy-gated auto-merge. It does not bypass
          # branch protection: GitHub merges only after every required check
          # remains successful on this exact release commit.
          gh pr merge "$PR_URL" --merge --auto

          # GitHub can take a moment to complete the protected auto-merge
          # after the final status arrives.
          for attempt in {1..30}; do
            if [ "$(gh pr view "$PR_URL" --json state --jq '.state')" = "MERGED" ]; then
              break
            fi

            sleep 10
          done

          if [ "$(gh pr view "$PR_URL" --json state --jq '.state')" != "MERGED" ]; then
            echo "Timed out waiting for GitHub to mark $PR_URL mergeable" >&2
            exit 1
          fi

      - name: Dispatch and wait for deployment
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_sha="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          gh workflow run Deploy --ref main

          for attempt in {1..30}; do
            run_id="$(gh run list \
              --workflow Deploy \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$release_sha\") | .databaseId" \
              | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi

            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "Timed out waiting for Deploy to start for $release_sha" >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status --interval 10
