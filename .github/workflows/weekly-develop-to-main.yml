name: Weekly Develop to Main

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-develop-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Open and merge develop release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Create or find main synchronization PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          behind_by="$(gh api "repos/${{ github.repository }}/compare/main...develop" --jq '.behind_by')"
          echo "needs_sync=$([ "$behind_by" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          if [ "$behind_by" -eq 0 ]; then
            exit 0
          fi

          pr_url="$(gh pr list --base develop --head main --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base develop \
              --head main \
              --title "chore: synchronize main into develop" \
              --body "Automated synchronization required before the protected develop-to-main release PR can merge.")"
          fi

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Wait for synchronization checks and merge
        if: steps.sync.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.sync.outputs.pr_url }}
        run: |
          for attempt in {1..30}; do
            check_count="$(gh pr checks "$PR_URL" --required --json name,state --jq 'length' 2>/dev/null || true)"
            if [ "${check_count:-0}" -gt 0 ]; then
              break
            fi

            sleep 10
          done

          if [ "${check_count:-0}" -eq 0 ]; then
            echo "Timed out waiting for required checks to register on $PR_URL" >&2
            exit 1
          fi

          gh pr checks "$PR_URL" --required --watch --interval 10
          gh pr merge "$PR_URL" --merge

      - name: Detect unreleased develop changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead_by="$(gh api "repos/${{ github.repository }}/compare/main...develop" --jq '.ahead_by')"
          echo "has_changes=$([ "$ahead_by" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create or find release PR
        if: steps.changes.outputs.has_changes == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr_url="$(gh pr list --base main --head develop --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head develop \
              --title "chore: release develop to main" \
              --body "Automated weekly release PR from develop to main. It merges only after the required checks pass.")"
          fi

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks and merge the release
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ steps.release.outputs.pr_url }}
        run: |
          # A newly created PR can briefly have no check runs. Wait for the
          # PR-triggered checks to register before asking gh to watch them.
          for attempt in {1..30}; do
            check_count="$(gh pr checks "$PR_URL" --required --json name,state --jq 'length' 2>/dev/null || true)"
            if [ "${check_count:-0}" -gt 0 ]; then
              break
            fi

            sleep 10
          done

          if [ "${check_count:-0}" -eq 0 ]; then
            echo "Timed out waiting for required checks to register on $PR_URL" >&2
            exit 1
          fi

          gh pr checks "$PR_URL" --required --watch --interval 10
          gh pr merge "$PR_URL" --merge
