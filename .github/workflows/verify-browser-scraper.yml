name: Verify Browser Scraper

on:
  workflow_dispatch:
    inputs:
      authenticate:
        description: Try one login with the approved Reddit account
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Live Browser Probe
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::633025216388:role/GithubActions-Fairbanksio-F5oclock
          role-duration-seconds: 900

      - name: Verify Live Extraction
        env:
          F5_PROBE_AUTHENTICATE: ${{ inputs.authenticate }}
        run: node scripts/check-browser-deployment.cjs
