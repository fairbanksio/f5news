name: Verify Browser Scraper

on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Select the diagnostic to run
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - oauth
      challenge_screenshot:
        description: Capture one encrypted image if the Politics listing shows a challenge
        type: boolean
        default: false
      diagnostics_public_key:
        description: Base64 DER SPKI RSA public key for encrypted diagnostics or screenshot
        type: string
        default: ''
      subreddit:
        description: Feed for a single browser probe
        type: choice
        default: politics
        options:
          - politics
          - news
          - worldnews
      scheduled:
        description: Read scheduled completions from the last hour without invoking Lambda
        type: boolean
        default: false
      all_feeds:
        description: Verify all feeds, then wait five minutes before checking reuse
        type: boolean
        default: false
      session:
        description: Use the shared persisted Reddit session
        type: boolean
        default: true
      renew_session:
        description: Renew the shared session once, subject to login cooldown
        type: boolean
        default: false
      authenticate:
        description: Bootstrap one login with the approved Reddit account
        type: boolean
        default: false
      publisher_image_backfill:
        description: Repair recent cover images for the selected feed using publisher sources
        type: boolean
        default: false
      publisher_post_id:
        description: Reddit post ID for a single cover repair
        type: string
        default: ''
      publisher_image_url:
        description: Verified public HTTPS publisher image for the selected post
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Live Browser Probe
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::633025216388:role/GithubActions-Fairbanksio-F5oclock
          role-duration-seconds: 3600

      - name: Verify Live Extraction
        env:
          F5_PROBE_DIAGNOSTICS_KEY: ${{ inputs.diagnostics_public_key }}
          F5_PROBE_CHALLENGE_SCREENSHOT: ${{ inputs.challenge_screenshot }}
          F5_PROBE_DIAGNOSTICS: ${{ inputs.diagnostics }}
          F5_PROBE_SUBREDDIT: ${{ inputs.subreddit }}
          F5_PROBE_SCHEDULED: ${{ inputs.scheduled }}
          F5_PROBE_ALL_FEEDS: ${{ inputs.all_feeds }}
          F5_PROBE_SESSION: ${{ inputs.session }}
          F5_PROBE_RENEW_SESSION: ${{ inputs.renew_session }}
          F5_PROBE_AUTHENTICATE: ${{ inputs.authenticate }}
          F5_PROBE_PUBLISHER_IMAGE_BACKFILL: ${{ inputs.publisher_image_backfill }}
          F5_PROBE_PUBLISHER_POST_ID: ${{ inputs.publisher_post_id }}
          F5_PROBE_PUBLISHER_IMAGE_URL: ${{ inputs.publisher_image_url }}
        run: node scripts/check-browser-deployment.cjs
