name: Snyk

on:
  push:
      branches:
        - main
        - develop
  pull_request:
      branches:
        - develop
  pull_request_target:
      branches:
        - main
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-source:
    name: Snyk (${{ matrix.project }})
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - services/posts
          - services/scraper
          - services/subreddits
          - webui

    steps:
      - name: Require Snyk configuration
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is required for dependency scanning."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Scan dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          args: >-
            --file=${{ matrix.project }}/package-lock.json
            --package-manager=npm
            --severity-threshold=high
