name: 'Deploy'

on:
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      scope:
        description: Deployment scope
        type: choice
        default: full
        options:
          - full
          - changed
          - webui
          - posts
          - subreddits
          - scraper
          - infrastructure
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: 'Deployment Scope'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      infrastructure: ${{ steps.select.outputs.infrastructure }}
      posts: ${{ steps.select.outputs.posts }}
      scraper: ${{ steps.select.outputs.scraper }}
      subreddits: ${{ steps.select.outputs.subreddits }}
      webui: ${{ steps.select.outputs.webui }}
      scraper_verify: ${{ steps.select.outputs.scraper_verify }}
      services: ${{ steps.select.outputs.services }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
    - name: Select Changed Components
      id: select
      env:
        DEPLOY_SCOPE: ${{ inputs.scope }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/select-deployment.cjs

  infrastructure:
    name: 'Infrastructure'
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest

    # Checkout the repository to the GitHub Actions runner
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.15.4"
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      working-directory: 'infrastructure'
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      working-directory: 'infrastructure'
      run: terraform fmt -check

    # Build cluster first
    - name: Terraform Apply
      working-directory: 'infrastructure'
      run: terraform apply -auto-approve

  services:
    name: 'Serverless'
    needs: [changes, infrastructure]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') &&
      needs.changes.outputs.services == 'true'
    runs-on: ubuntu-24.04-arm

    # Required for Github-AWS OIDC to work
    permissions:
      id-token: write
      contents: read

    # Checkout the repository to the GitHub Actions runner
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Configure AWS Credentials
    # Basically run 'aws configure' as you would from local CLI
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: us-east-1
        role-to-assume: arn:aws:iam::633025216388:role/GithubActions-Fairbanksio-F5oclock
        role-duration-seconds: 3600 # Includes scheduled-run verification.

    # Install Nodejs
    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x

    # Deploy Posts Service
    - run: npm ci
      if: needs.changes.outputs.posts == 'true'
      name: "Posts Service - Install dependencies"
      working-directory: 'services/posts'

    - run: npx serverless deploy
      if: needs.changes.outputs.posts == 'true'
      env:
        SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      name: "Posts Service - Deploy"
      working-directory: 'services/posts'

    # Deploy Scraper Service
    - run: npm ci
      if: needs.changes.outputs.scraper == 'true' || needs.changes.outputs.scraper_verify == 'true'
      name: "Scraper Service - Install dependencies"
      working-directory: 'services/scraper'

    - run: npx serverless deploy
      if: needs.changes.outputs.scraper == 'true'
      env:
        SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      name: "Scraper Service - Deploy"
      working-directory: 'services/scraper'

    # Deploy Subreddits Service
    - run: npm ci
      if: needs.changes.outputs.subreddits == 'true'
      name: "Subreddits Service - Install dependencies"
      working-directory: 'services/subreddits'

    - run: npm run test:coverage
      if: needs.changes.outputs.subreddits == 'true'
      name: "Subreddits Service - Test"
      working-directory: 'services/subreddits'

    - run: npx serverless deploy
      if: needs.changes.outputs.subreddits == 'true'
      env:
        SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      name: "Subreddits Service - Deploy"
      working-directory: 'services/subreddits'

    - name: "Scraper Service - Verify Live Extraction"
      if: needs.changes.outputs.scraper_verify == 'true'
      env:
        F5_PROBE_DEPLOYMENT: "true"
      run: node scripts/check-browser-deployment.cjs

  webapp:
    name: 'Web App'
    needs: [changes, infrastructure, services]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') &&
      (needs.services.result == 'success' || needs.services.result == 'skipped') &&
      needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest

    # Required for Github-AWS OIDC to work
    permissions:
      id-token: write
      contents: read

    # Checkout the repository to the GitHub Actions runner
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Configure AWS Credentials
    # Basically run 'aws configure' as you would from local CLI
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: us-east-1
        role-to-assume: arn:aws:iam::633025216388:role/GithubActions-Fairbanksio-F5oclock
        role-duration-seconds: 1200 # Optional duration, 20 minutes in this case

    # Install Nodejs
    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x

    # Deploy Posts Service
    - run: npm ci
      name: "Install dependencies"
      working-directory: 'webui'

    - run: npm run generate-config
      name: "Generate Runtime Configuration"
      working-directory: 'webui'

    - run: npm run deploy
      name: "Deploy"
      working-directory: 'webui'
